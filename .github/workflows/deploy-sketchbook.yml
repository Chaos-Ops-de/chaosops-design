name: Deploy Sketchbook

# Builds this design system's Storybook ("the sketchbook") and deploys it to
# sketchbook.chaos-ops.de as a standalone dev-reference tool — independent
# of the npm package release in release.yml, so it always reflects the
# latest main, not just tagged releases.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Sketchbook Image
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Chaos-Ops-de'
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.name.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Derive image name (lowercase owner)
        id: name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${OWNER}/chaosops-sketchbook" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push sketchbook image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:release
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=sketchbook
          cache-to: type=gha,scope=sketchbook,mode=max

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          SKETCHBOOK_IMAGE: ${{ needs.build-and-push.outputs.image }}:release
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR_SKETCHBOOK }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GH_ACTOR,SKETCHBOOK_IMAGE,DEPLOY_DIR
          script: |
            set -e

            echo "Logging in to GHCR..."
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

            echo "Pulling latest sketchbook image..."
            docker pull "${SKETCHBOOK_IMAGE}"

            echo "Restarting sketchbook..."
            cd "${DEPLOY_DIR}"
            if ! SKETCHBOOK_IMAGE="${SKETCHBOOK_IMAGE}" docker compose up -d --no-build; then
              echo "::group::sketchbook container logs (last 200 lines)"
              docker compose logs sketchbook --tail=200 || true
              echo "::endgroup::"
              docker logout ghcr.io
              exit 1
            fi

            docker logout ghcr.io
            echo "Deployment complete — https://sketchbook.chaos-ops.de"
